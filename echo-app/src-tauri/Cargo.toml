[package]
name = "echo"
version = "0.4.0"
description = "Echo - Universal Voice Keyboard"
authors = []
edition = "2021"

# The Tauri app crate doubles as the workspace root so the shared plugin API
# (echo-sdk) builds alongside it. Keeping the root here (rather than at
# echo-app/) leaves the Cargo.lock, target dir, and all build tooling paths
# unchanged.
[workspace]
# `plugin-examples/hello-echo` is the scaffold template's own output. It is a
# member so `cargo build` compiles it against this exact SDK and toolchain:
# a starter project that stops compiling is worse than none at all.
members = ["echo-sdk", "plugin-examples/hello-echo"]
# A workspace with a root package builds only that package by default, which
# would have left the example compiled by nobody — the opposite of why it is
# here. Listing all three means `cargo build`/`check`/`clippy` at this root
# really do compile the scaffold template, so one that stops compiling is
# caught rather than shipped.
default-members = [".", "echo-sdk", "plugin-examples/hello-echo"]
resolver = "2"

[lib]
name = "echo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# In-process local Whisper via whisper-rs (whisper.cpp compiled in). Off by
# default because building whisper.cpp needs cmake + libclang (LLVM). The
# default local engine instead shells out to a bundled `whisper-cli` binary
# (see core/asr/whisper_cli.rs) which needs no build toolchain.
# Enable with: cargo build --features whisper
whisper = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` gates `tauri::tray`: the status-area icon is the only persistent
# way back into Echo (see src/tray.rs).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Already in the tree via the toolkits below; named here because `partial_edit`
# depends on it directly — a backspace deletes a grapheme cluster, not a char.
unicode-segmentation = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# In-app auto-update (checks a signed latest.json on GitHub Releases) + process
# restart after applying an update. Dormant until a signing key is configured —
# see docs/RELEASING.md.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Launch at login. The OS keeps the registration (a registry Run key, a macOS
# LaunchAgent, an XDG .desktop file), so the plugin is queried for state rather
# than a setting being mirrored into `echo.db` where the two could disagree.
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

rusqlite = { version = "0.31", features = ["bundled"] }

cpal = "0.15"
ringbuf = "0.3"

thiserror = "1"
anyhow = "1"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

async-trait = "0.1"

# HTTP client for downloading ASR models and calling cloud ASR APIs (uses
# platform default TLS — schannel on Windows — to avoid extra native build deps).
reqwest = { version = "0.12", features = ["stream", "multipart", "json"] }
futures-util = "0.3"
base64 = "0.22"

# WebSocket client for true streaming ASR (Deepgram). native-tls uses the OS
# TLS stack (schannel on Windows) so it adds no openssl/cmake build deps.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# Extract the bundled whisper.cpp release archive (downloaded on first run).
# Pure-Rust deflate, no native build deps.
zip = { version = "2", default-features = false, features = ["deflate"] }

ndarray = "0.16"

# WAV encoding for cloud ASR uploads.
hound = "3.5"

# Secure API-key storage in the OS keychain.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Dynamic loading of native plugins (experimental, advisory permission model).
libloading = "0.8"

# Fingerprinting plugin libraries, so one swapped after install is refused.
# Already in the tree transitively; named here because we now depend on it.
sha2 = "0.10"

# Cross-platform clipboard for paste-based text injection (save → set → paste →
# restore). More reliable than per-keystroke synthesis for long transcripts and
# works where synthetic typing is blocked (e.g. some Wayland compositors).
arboard = "3"

# Shared plugin API — the trait/manifest definitions plugin authors compile
# against. The host must use the same definitions for the FFI to be sound.
echo-sdk = { path = "echo-sdk" }

# Local Whisper (optional — see [features].whisper above).
whisper-rs = { version = "0.13", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    # Foreground-window lookup for per-app profiles (core::appcontext).
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Foundation",
    # UI Automation: is the focused control a password field (core::field)?
    # Win32 window styles only describe native edit controls, and the password
    # boxes people actually use are drawn by browsers and Electron.
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    # Resident-memory reporting for `--benchmark` (core::procinfo).
    "Win32_System_ProcessStatus",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Bare-modifier hotkeys need raw key state, and XQueryKeymap reports the whole
# keyboard in one call. X11 only: Wayland has no equivalent, and the watcher
# reports itself unavailable there rather than binding a key that does nothing.
x11 = { version = "2", features = ["xlib"] }
# AT-SPI, for telling a password field apart (core::field). Already in the tree
# through notify-rust with these same default features (async-io, blocking
# API), so naming it adds no crate and no second async runtime. The `atspi`
# crate would add four crates to make three D-Bus calls and one match rule.
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

# ONNX Runtime, behind Silero VAD and the wake word. Declared twice, because
# Intel macOS cannot get it the way every other target does.
#
# Everywhere else, `ort` downloads a prebuilt ONNX Runtime at build time and
# STATICALLY links it (`rustc-link-lib=static=onnxruntime`), so the runtime is
# baked into the executable and there is nothing to ship alongside it.
#
# `x86_64-apple-darwin` has no such prebuilt: ort-sys's
# `build/download/dist.txt` lists `aarch64-apple-darwin` alone, and Microsoft
# stopped publishing `onnxruntime-osx-x86_64-*.tgz` after 1.23.2 (1.24.1,
# 1.24.2 and everything since ship `osx-arm64` only). So the Intel build uses
# `load-dynamic`: it links nothing, and dlopens the official 1.23.2 Intel
# dylib that `scripts/stage-runtime-deps.mjs` stages into the bundle (see
# `core::vad::silero::load_onnx_runtime`). The alternative, compiling ONNX
# Runtime from source, is an hour-scale C++ build on a runner kind GitHub is
# retiring in August 2027.
#
# `api-23` is what makes 1.23.2 usable at all. `ort`'s defaults request API 24,
# and `load-dynamic` refuses a runtime older than the API it was built for.
# `ort` 2.0.0-rc.12 gates nothing of its Rust API on `api-24`, so this costs
# Echo no call it makes. The static targets keep the
# defaults (API 24 against the 1.24.2 they download) — resolver 2 ignores the
# features of a target table that does not match, so neither declaration
# leaks into the other's build.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
ort = { version = "2.0.0-rc.10", features = ["download-binaries", "ndarray"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "2.0.0-rc.10", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "load-dynamic",
    "api-23",
] }

