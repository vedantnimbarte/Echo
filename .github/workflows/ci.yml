name: CI

# Fast verification on every push/PR: dependency audit, Rust lint + tests,
# and frontend/website typecheck + build. The heavier cross-platform installer
# build lives in release.yml and runs only on tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # `cargo audit` only scans Cargo.lock, so this job needs no system deps and is
  # very fast. The accepted/ignored transitive advisories live in
  # echo-app/src-tauri/.cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
        working-directory: echo-app/src-tauri

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: echo-app/src-tauri

      # Without this the formatting drifts straight back, and `cargo fmt --check`
      # stops being usable for spotting your own drift because it is already
      # reporting everyone else's. Formatting is platform-independent, so the
      # macOS job below does not repeat it.
      - name: cargo fmt --check
        run: cargo fmt --manifest-path echo-app/src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path echo-app/src-tauri/Cargo.toml --all-targets

      # `clippy --all-targets` compiles the tests but never runs them, so until
      # now nothing in CI executed a single assertion.
      - name: cargo test
        run: cargo test --manifest-path echo-app/src-tauri/Cargo.toml --lib

      # Unit tests never launch the binary, and two real bugs shipped in the
      # gap: a `tokio::spawn` in Tauri's setup hook that panicked before the
      # window appeared, and a dictionary panic inside the transcript task.
      # `--selftest` runs a real startup and pushes synthetic audio through
      # the pipeline, so that class of failure is caught here rather than by
      # whoever installs the release.
      #
      # Tauri creates a webview before `setup` runs, so this needs a display
      # even though nothing is ever shown; xvfb provides one. The frontend
      # has to exist first because `frontendDist` points at ../dist.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: echo-app/package-lock.json
      - name: Build the frontend
        working-directory: echo-app
        run: |
          npm ci
          npm run build
      - name: Install xvfb
        run: sudo apt-get install -y xvfb
      - name: Self-test a real startup
        run: |
          cargo build --manifest-path echo-app/src-tauri/Cargo.toml
          xvfb-run -a ./echo-app/src-tauri/target/debug/echo --selftest

      # Not for the timings — a shared runner is far too noisy for those to
      # mean anything, and it has no model to transcribe with. This only
      # proves the harness still runs, so it cannot rot unnoticed between
      # the times somebody actually wants a measurement.
      - name: Benchmark harness runs
        run: xvfb-run -a ./echo-app/src-tauri/target/debug/echo --benchmark

  # `platform/macos.rs` is cfg-gated, so the Linux job never compiles a line of
  # it. Until now it was built only when a release tag fired, which meant a
  # break in the macOS injector was discovered while cutting a release. Runners
  # are free for public repositories, so there is no reason to wait that long.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: echo-app/src-tauri
      - name: cargo clippy
        run: cargo clippy --manifest-path echo-app/src-tauri/Cargo.toml --all-targets
      - name: cargo test
        run: cargo test --manifest-path echo-app/src-tauri/Cargo.toml --lib

  # Intel macOS is built differently from every other target — `ort` with
  # `load-dynamic` at API 23 against a downloaded 1.23.2 dylib, instead of a
  # statically linked 1.24.2 — so the arm64 job above proves nothing about it.
  #
  # This runs on a real Intel runner rather than cross-checking from
  # macos-latest, because the part most likely to be wrong is not compilation:
  # it is whether that dylib loads and Silero actually runs on it, and only the
  # tests show that. The release cross-compiles instead (see release.yml).
  # macos-15-intel is GitHub's last x86_64 image and is retired in August 2027;
  # when it goes, replace this with `cargo clippy --target x86_64-apple-darwin`
  # on macos-latest, which still catches a compile break.
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: echo-app/src-tauri
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      # A test binary is not inside an app bundle, so point `ort` at the
      # runtime the way a developer would. The staging script is what fetches
      # and verifies it for the release; run the same code here rather than a
      # second copy of the URL and checksum.
      - name: Fetch the Intel ONNX Runtime
        working-directory: echo-app
        run: |
          node scripts/stage-runtime-deps.mjs --onnxruntime-only
          echo "ORT_DYLIB_PATH=$PWD/src-tauri/resources/bin/libonnxruntime.dylib" >> "$GITHUB_ENV"
      - name: cargo clippy
        run: cargo clippy --manifest-path echo-app/src-tauri/Cargo.toml --all-targets
      - name: cargo test
        run: cargo test --manifest-path echo-app/src-tauri/Cargo.toml --lib

  # Same reasoning as the macOS job, for the arm64 Linux build release.yml now
  # ships: without it, an aarch64-only break (a dependency with no arm64
  # binaries, a cfg that assumed x86_64) would surface only when a tag fired.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: echo-app/src-tauri
      - name: cargo clippy
        run: cargo clippy --manifest-path echo-app/src-tauri/Cargo.toml --all-targets
      - name: cargo test
        run: cargo test --manifest-path echo-app/src-tauri/Cargo.toml --lib

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            echo-app/package-lock.json
            website/package-lock.json
      # Until these existed, 6,000 lines of frontend had no automated check of
      # any kind while the Rust side had 240 tests — so a panel that threw on
      # mount was found by whoever installed the release. These are smoke tests:
      # every Settings page and panel renders against a fake Tauri backend.
      - name: App - install, typecheck & test
        working-directory: echo-app
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Website - install, lint & build
        working-directory: website
        run: |
          npm ci
          npm run lint
          npm run build
