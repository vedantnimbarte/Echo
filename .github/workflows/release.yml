name: Release

# Build installers for all platforms when a release tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: echo-app/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: echo-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: echo-app

      # Stage the offline whisper-cli into resources/bin so the installer ships
      # it and a fresh install transcribes offline out of the box. Windows
      # downloads a prebuilt CLI; macOS/Linux build it from source (needs cmake).
      - name: Stage runtime deps (whisper-cli)
        run: node scripts/stage-runtime-deps.mjs
        working-directory: echo-app

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-update signing. Generate once with `npm run tauri signer generate`,
          # put the private key in this secret and its public key in
          # tauri.conf.json → plugins.updater.pubkey. See docs/RELEASING.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: echo-app
          tagName: ${{ github.ref_name }}
          releaseName: "Echo ${{ github.ref_name }}"
          # Draft on purpose: the assets get checksummed and the packaging
          # manifests updated by the job below before a human publishes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Checksum every artifact, attach SHA256SUMS.txt (the install scripts verify
  # against it), and fill the packaging manifests in with the real URLs/hashes.
  manifests:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch, not the detached tag, so the manifest commit
          # has somewhere to land.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-assets
          gh release download "${{ github.ref_name }}"             --repo "$GITHUB_REPOSITORY" --dir dist-assets --clobber

      - name: Update manifests and write checksums
        run: node scripts/update-manifests.mjs "${{ github.ref_name }}" dist-assets

      - name: Attach SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}"             dist-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packaging; then
            echo "manifests unchanged"
            exit 0
          fi
          git add packaging
          git commit -m "chore(packaging): manifests for ${{ github.ref_name }}"
          git push
