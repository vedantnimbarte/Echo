name: Release

# Build installers for all platforms when a release tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Apple Silicon only. A universal build also compiles for
          # x86_64-apple-darwin, and `ort` (the ONNX Runtime behind Silero VAD
          # and wake word) publishes no prebuilt binaries for that target —
          # `ort-sys`'s dist.txt lists aarch64-apple-darwin alone. Building
          # universal fails at link time; Intel support would mean compiling
          # ONNX Runtime from source.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            cmake

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: echo-app/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: echo-app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: echo-app

      # Stage the offline whisper-cli into resources/bin so the installer ships
      # it and a fresh install transcribes offline out of the box. Windows
      # downloads a prebuilt CLI; macOS/Linux build it from source (needs cmake).
      - name: Stage runtime deps (whisper-cli)
        run: node scripts/stage-runtime-deps.mjs
        working-directory: echo-app

      # Signing is opt-in, and the opt-in has to be the *absence of the
      # variable* rather than an empty one.
      #
      # This step exists because of a release that failed. The signing values
      # used to sit in the `env:` of the build step below, on the assumption
      # that an unset secret meant no signing. It does not: a missing secret
      # interpolates to an empty string and the variable is still **defined**,
      # and Tauri's bundler decides to sign on whether APPLE_CERTIFICATE is
      # present, not on whether it holds anything. So a repository with no
      # secrets at all tried to sign, `security import` got an empty
      # certificate, and the macOS job died after a full compile — producing no
      # .dmg, which skipped the checksum job and left every platform's
      # installer unverifiable.
      #
      # Writing to $GITHUB_ENV is what makes "unset" expressible: a name only
      # enters the environment if this step echoes it. Keep it that way. Adding
      # a key back to the `env:` block below reintroduces the bug in a form
      # that only appears on a tagged release.
      - name: Enable code signing, but only where a certificate really exists
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Forward one variable to later steps, and only if it has a value.
          # The heredoc form is what keeps a multi-line secret — a base64 .p12,
          # an updater private key — intact rather than truncated at line one.
          forward() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              {
                echo "$name<<__ECHO_SECRET_EOF__"
                echo "$value"
                echo "__ECHO_SECRET_EOF__"
              } >> "$GITHUB_ENV"
              echo "  $name: set"
            fi
          }

          # macOS. Unsigned, Gatekeeper does not warn, it refuses — the only
          # button it offers is "Move to Trash" — so this is the one platform
          # where signing gates installability at all, and it additionally
          # gates a Homebrew cask and a Flathub submission. $99/yr.
          #
          # APPLE_CERTIFICATE            base64 of the Developer ID .p12
          # APPLE_CERTIFICATE_PASSWORD   its export password
          # APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
          # APPLE_ID / APPLE_PASSWORD    Apple ID + an app-specific password
          # APPLE_TEAM_ID                the 10-character team id
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Apple certificate present, signing this build:"
            forward APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            forward APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            forward APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            forward APPLE_ID "$APPLE_ID"
            forward APPLE_PASSWORD "$APPLE_PASSWORD"
            forward APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            echo "No Apple certificate configured. Building unsigned — users"
            echo "right-click then Open, as the README describes."
          fi

          # Windows Authenticode. Lower priority than macOS: SmartScreen warns
          # but still offers "More info -> Run anyway". Worth buying early even
          # so, because an OV certificate earns reputation on wall-clock time.
          if [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "Windows certificate present, signing this build:"
            forward WINDOWS_CERTIFICATE "$WINDOWS_CERTIFICATE"
            forward WINDOWS_CERTIFICATE_PASSWORD "$WINDOWS_CERTIFICATE_PASSWORD"
          else
            echo "No Windows certificate configured. Building unsigned."
          fi

          # Auto-update signing. Generate once with
          # `npm run tauri signer generate`; the public half goes into
          # tauri.conf.json -> plugins.updater.pubkey. See docs/RELEASING.md.
          if [ -n "$UPDATER_KEY" ]; then
            echo "Updater key present, signing update artifacts:"
            forward TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY"
            forward TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_KEY_PASSWORD"
          else
            echo "No updater key configured. Releases ship no latest.json."
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing variables are deliberately absent here. The step above
          # adds them only when a real certificate exists — read its comment
          # before putting anything back in this block.
        with:
          projectPath: echo-app
          tagName: ${{ github.ref_name }}
          releaseName: "Echo ${{ github.ref_name }}"
          # Draft on purpose: the assets get checksummed and the packaging
          # manifests updated by the job below before a human publishes.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Checksum every artifact, attach SHA256SUMS.txt (the install scripts verify
  # against it), and fill the packaging manifests in with the real URLs/hashes.
  manifests:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the branch, not the detached tag, so the manifest commit
          # has somewhere to land.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-assets
          gh release download "${{ github.ref_name }}"             --repo "$GITHUB_REPOSITORY" --dir dist-assets --clobber

      - name: Update manifests and write checksums
        run: node scripts/update-manifests.mjs "${{ github.ref_name }}" dist-assets

      - name: Attach SHA256SUMS.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}"             dist-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- packaging; then
            echo "manifests unchanged"
            exit 0
          fi
          git add packaging
          git commit -m "chore(packaging): manifests for ${{ github.ref_name }}"
          git push
