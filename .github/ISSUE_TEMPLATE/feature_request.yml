name: Feature request
description: Something Echo should be able to do and cannot.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What you want to do
      description: >
        The thing you were trying to get done, not the control you imagine adding.
        A described problem usually has a smaller solution than a described feature.
      placeholder: |
        I dictate in English and Hindi in the same sitting, and switching language
        means opening Settings every time.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: Optional, but it says a lot about how much this costs you.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Filled in by Settings → Report an issue when the request is about a
        specific engine, platform or device. Clear it if it is not relevant.
      render: text
    validations:
      required: false
